# snapcook-core -- the pure-Python domain library.
#
# Licensed Apache-2.0, deliberately NOT AGPL like the rest of the repo. This
# package is the schema, the hash contract, the unit system and the renderers.
# It is meant to be reused by a Flutter client, a CLI, third-party importers and
# a future self-hosted LLM service; copyleft here would defeat that.
# See ../../LICENSING.md.
#
# HARD RULE: this package must never import Django. tests/test_no_django.py
# enforces it with an AST walk over every module.

[project]
name = "snapcook-core"
version = "0.1.0"
description = "Structured recipe model: schema, content-addressed store, units, renderers"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    # Schema + validation. Strict mode is what neutralises YAML's implicit typing.
    "pydantic>=2.9",
    # Unit registry. Chosen for offset-unit support (degC<->degF is affine, not
    # multiplicative) and contexts (per-ingredient density makes volume->mass legal).
    "pint>=0.24",
    # RFC 8785 JSON Canonicalization Scheme. Pure Python, zero deps.
    "rfc8785>=0.1.4",
    # Round-trip YAML, needed to read frontmatter without destroying it.
    "ruamel.yaml>=0.18",
    "python-ulid>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapcook_core"]
