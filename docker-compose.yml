#
# The setup with a separate database: three services. The image also runs on
# its own, database included, which is how docs/install.md sets up Unraid.
# Losing pgdata costs accounts, settings and social data; `manage.py reindex
# --full` rebuilds the recipe projection from ./data/store.
#
# Run the published image (docs/install.md):
#   docker compose pull && docker compose up -d --no-build --wait
# or build it here with the commit stamped in so /up can report it:
#   GIT_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
# which ./scripts/build.sh and ./scripts/local_start.sh do for you. A local
# build takes the name SNAPCOOK_IMAGE, so the worker runs the same image.

services:
  db:
    image: postgres:17-alpine
    container_name: snap-cook-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snapcook}
      POSTGRES_USER: ${POSTGRES_USER:-snapcook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      # Unraid: /mnt/user/appdata/snap-cook/pgdata
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapcook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${SNAPCOOK_IMAGE:-ghcr.io/yannicksuter/snap-cook:stable}
    container_name: snap-cook-web
    restart: unless-stopped
    command: ["web"]
    ports:
      - "8931:8931"
    volumes:
      # The authoritative recipe store. Back THIS up.
      # Unraid: /mnt/user/appdata/snap-cook/data
      - ./data:/data
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=0
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
    # Health comes from the image's HEALTHCHECK (Dockerfile): /up, as Unraid
    # sees it too.

  worker:
    image: ${SNAPCOOK_IMAGE:-ghcr.io/yannicksuter/snap-cook:stable}
    container_name: snap-cook-worker
    restart: unless-stopped
    command: ["worker"]
    volumes:
      # MUST be the same mount as web: the import job writes store objects that
      # the web tier then reads. Diverging these two paths produces a very
      # confusing "the import succeeded but the recipe does not exist" bug.
      - ./data:/data
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=0
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
      # Not for correctness -- so the web container has run migrations before
      # the worker starts querying tables.
      web:
        condition: service_started
