{% load allauth %}
<section class="pt-2">
  <h2 class="px-5 pt-6 text-[20px] font-extrabold">{% slot title %}{% endslot %}</h2>
  {% slot body %}{% endslot %}
  {% if slots.actions %}
    <div class="px-5 pb-8 flex flex-col gap-3">{% for action in slots.actions %}{{ action }}{% endfor %}</div>
  {% endif %}
</section>
