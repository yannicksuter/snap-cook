{% load allauth %}
<div class="flex flex-col gap-1.5">
  {% if attrs.type != "checkbox" and attrs.type != "radio" %}
    <label for="{{ attrs.id }}" class="text-[17px] font-bold">{% slot label %}{% endslot %}</label>
  {% endif %}
  <input {% if attrs.required %}required{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.readonly %}readonly{% endif %} {% if attrs.checked %}checked{% endif %}
         {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
         {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %} {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
         {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %} type="{{ attrs.type }}"
         class="{% if attrs.type == 'checkbox' or attrs.type == 'radio' %}w-5 h-5{% else %}h-14 w-full px-4 rounded-[14px] border-2 border-line-strong text-[18px] outline-none focus:border-herb{% endif %}">
  {% if attrs.type == "checkbox" or attrs.type == "radio" %}
    <label for="{{ attrs.id }}" class="text-[17px]">{% slot label %}{% endslot %}</label>
  {% endif %}
  {{ attrs.errors }}
  {% if slots.help_text %}<span class="text-[15px] text-ink-3">{% slot help_text %}{% endslot %}</span>{% endif %}
</div>
