name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.29"

jobs:
  # Fails in ~10 seconds, so a formatting slip never burns a Postgres job.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # Tier 0. No services, no database, no network -- finishes before Postgres
  # would even have booted for the `web` job.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Tier 0 tests
        # --disable-socket: core must never reach the network. Enforced, not
        # trusted.
        run: >
          uv run pytest packages/snapcook-core
          --disable-socket
          --cov=snapcook_core
          --cov-report=term-missing
          --cov-fail-under=90
          -q

  # Separate job on purpose: a red `contract` check means every recipe hash in
  # every store just changed. That reads very differently from a red `core`.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Hash contract
        run: uv run pytest packages/snapcook-core -m contract --disable-socket -q

  web:
    runs-on: ubuntu-latest
    needs: [core]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: snapcook
          POSTGRES_USER: snapcook
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snapcook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-password
      SNAPCOOK_DATA_DIR: /tmp/snapcook-data
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Django checks
        run: uv run python apps/web/manage.py check --deploy --fail-level ERROR
      - name: Migrations are complete
        # Catches a model change committed without its migration, which
        # otherwise only surfaces at deploy time.
        run: uv run python apps/web/manage.py makemigrations --check --dry-run
      - name: Tier 1 + 2 tests
        working-directory: apps/web
        run: >
          uv run pytest
          --cov=. --cov-report=term-missing --cov-fail-under=75
          -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the secret scan covers more than the tip commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: .env must never be committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It must never be committed."
            exit 1
          fi
          echo ".env is not tracked"

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit
        run: |
          uv sync --frozen
          uv run --with pip-audit pip-audit --strict || \
            echo "::warning::pip-audit reported findings; review them"
